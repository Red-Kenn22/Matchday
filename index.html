<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b192c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Matchday — Pitchside Coaching App</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6EG2JQGKMS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6EG2JQGKMS');
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --navy-950: #06101e; --navy-900: #0b192c; --navy-800: #132743; --navy-700: #1e3a5f;
      --sky-token: #72c2eb; --pitch-dark: #1b6b36; --pitch-light: #207a3e;
      --day-bg: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #475569;
      --green-bright: #16a34a; --amber-warn: #d97706; --red-danger: #dc2626;
      --teal-badge: #134e4a; --teal-text: #5eead4; --touch-min: 46px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--day-bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 74px; overflow-x: hidden; }

    /* CLEANUP 1: COMPACT BROADCAST SCOREBUG HEADER */
    .top-cockpit { background: var(--navy-900); color: #fff; padding: 8px 10px; border-bottom: 2px solid var(--navy-700); position: sticky; top: 0; z-index: 900; box-shadow: 0 3px 10px rgba(0,0,0,0.25); }
    .app-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 6px; }
    .brand-logo { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 0.86rem; letter-spacing: 0.5px; color: #fff; cursor: pointer; }
    .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sky-token); display: inline-block; }
    .header-pills { display: flex; gap: 5px; align-items: center; }
    .icon-pill { background: var(--navy-800); border: 1px solid var(--navy-700); color: #cbd5e1; font-size: 0.72rem; font-weight: 800; height: 30px; padding: 0 8px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
    .icon-pill.settings-btn { background: var(--sky-token); color: var(--navy-950); border-color: #fff; font-weight: 900; }
    .dot-indicator { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
    .dot-indicator.active { background: #22c55e; }
    .dot-indicator.syncing { background: #f59e0b; }

    .scoreboard-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 4px 0 6px; border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .score-team-col { display: flex; align-items: center; gap: 5px; overflow: hidden; }
    .score-team-col.home { justify-content: flex-start; text-align: left; }
    .score-team-col.away { justify-content: flex-end; text-align: right; }
    .us-tag { font-size: 0.58rem; font-weight: 900; padding: 1px 4px; border-radius: 4px; background: var(--teal-badge); color: var(--teal-text); border: 1px solid #0d9488; flex-shrink: 0; }
    .score-team-name { font-size: 0.92rem; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score-center-box { background: var(--navy-950); border: 1.5px solid var(--navy-700); border-radius: 8px; padding: 2px 12px; font-size: 1.35rem; font-weight: 900; color: #fff; letter-spacing: 1.5px; min-width: 78px; text-align: center; }

    /* UNIFIED CLOCK + SUB TIMER + PERIOD BAR */
    .control-strip { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; }
    .clock-pill-box { display: flex; align-items: center; gap: 6px; background: var(--navy-950); border: 1.5px solid var(--navy-700); border-radius: 8px; padding: 4px 8px; cursor: pointer; min-height: 38px; }
    .period-tag { font-size: 0.65rem; font-weight: 900; padding: 2px 5px; border-radius: 4px; background: #1e293b; color: #cbd5e1; }
    .period-tag.live { background: #064e3b; color: #6ee7b7; }
    .match-timer { font-size: 1.15rem; font-weight: 900; font-variant-numeric: tabular-nums; color: #fff; }
    .stoppage-badge { font-size: 0.78rem; color: #fbbf24; font-weight: 900; }

    .sub-pill-box { display: flex; align-items: center; gap: 5px; background: var(--navy-800); border: 1.5px solid var(--navy-700); border-radius: 8px; padding: 4px 8px; font-size: 0.75rem; font-weight: 900; color: #e2e8f0; cursor: pointer; min-height: 38px; }
    .sub-pill-digits { font-family: monospace; font-size: 0.95rem; color: #38bdf8; font-weight: 900; }
    .sub-pill-box.alarm-ringing { background: #dc2626; border-color: #fca5a5; color: #fff; animation: pulseAlarm 0.7s infinite alternate; }
    .sub-pill-box.alarm-ringing .sub-pill-digits { color: #fff; }
    @keyframes pulseAlarm { from { background-color: #dc2626; } to { background-color: #991b1b; } }

    .clock-btns-right { display: flex; gap: 5px; flex: 1; justify-content: flex-end; }
    .btn-ctrl-main { min-height: 38px; padding: 0 11px; border-radius: 8px; font-size: 0.8rem; font-weight: 900; border: 1.5px solid #22c55e; background: var(--green-bright); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
    .btn-ctrl-main.amber { background: var(--amber-warn); border-color: #fbbf24; }
    .btn-ctrl-main.red { background: var(--red-danger); border-color: #f87171; }
    .btn-ctrl-main.navy { background: var(--navy-700); border-color: #64748b; }

    /* COLLAPSIBLE CLOCK & SUB ADJUST DRAWER */
    .Quick-adj-drawer { display: none; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #334155; font-size: 0.72rem; color: #94a3b8; font-weight: 800; }
    .Quick-adj-drawer.open { display: flex; }
    .btn-mini-adj { background: var(--navy-800); border: 1px solid #475569; color: #fff; border-radius: 6px; padding: 4px 8px; font-size: 0.72rem; font-weight: 800; cursor: pointer; }

    .view-section { display: none; padding: 8px 10px; max-width: 600px; width: 100%; margin: 0 auto; }
    .view-section.active { display: block; }
    .day-card { background: var(--card-bg); border: 2px solid var(--text-main); border-radius: 12px; padding: 10px; margin-bottom: 10px; box-shadow: 0 2px 0 rgba(15,23,42,0.1); }
    .day-card-title { font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }

    /* 1-LINE ADVISOR TICKER ABOVE PITCH */
    .equal-ticker { background: #0f172a; color: #fff; border: 2px solid var(--text-main); border-bottom: none; border-radius: 12px 12px 0 0; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 36px; font-size: 0.75rem; font-weight: 800; }
    .btn-quick-swap { background: var(--green-bright); color: #fff; border: 1.5px solid #bbf7d0; border-radius: 6px; padding: 3px 9px; font-weight: 900; font-size: 0.72rem; cursor: pointer; flex-shrink: 0; min-height: 28px; }

    /* PITCH BOARD & CLEANUP 2: DECLUTTERED PITCH TOKENS */
    .pitch-wrapper { background: var(--card-bg); border: 2px solid var(--text-main); border-radius: 0 0 12px 12px; padding: 6px; margin-bottom: 8px; box-shadow: 0 2px 0 rgba(15,23,42,0.1); }
    .pitch-wrapper.standalone { border-radius: 12px; }
    .pitch-board { position: relative; width: 100%; height: 390px; background: repeating-linear-gradient(0deg, var(--pitch-dark) 0px, var(--pitch-dark) 36px, var(--pitch-light) 36px, var(--pitch-light) 72px); border: 2px solid #fff; border-radius: 8px; overflow: hidden; }
    .pitch-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .pitch-overlay-badge { position: absolute; top: 6px; background: rgba(6,16,30,0.85); color: #fff; font-size: 0.65rem; font-weight: 900; padding: 3px 7px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); z-index: 5; pointer-events: none; }
    .pitch-overlay-badge.left { left: 6px; }
    .pitch-overlay-badge.right { right: 6px; }
    .pitch-empty-msg { position: absolute; inset: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(6,16,30,0.88); color: #fff; border-radius: 10px; padding: 16px; z-index: 20; font-weight: 800; gap: 10px; }

    .pitch-token { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: grab; z-index: 10; width: 66px; touch-action: none; }
    .pitch-token.selected .token-disc, .pitch-token.dragging .token-disc { outline: 3.5px solid #facc15; transform: scale(1.14); }
    .pitch-token.dragging { z-index: 50; }
    .token-disc { width: 42px; height: 42px; border-radius: 50%; background: var(--sky-token); border: 3px solid var(--navy-950); color: var(--navy-950); font-size: 1.05rem; font-weight: 900; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.45); pointer-events: none; }
    /* Ring colors encode Equal Play status without text clutter */
    .token-disc.met-floor { border-color: #22c55e; box-shadow: 0 0 0 1.5px #14532d, 0 2px 5px rgba(0,0,0,0.45); }
    .token-disc.cap-reached { border-color: #f97316; box-shadow: 0 0 0 2px #fed7aa, 0 2px 6px rgba(0,0,0,0.5); }
    .token-role-pill { position: absolute; top: -5px; right: -10px; background: var(--navy-950); color: #fff; font-size: 0.55rem; font-weight: 900; padding: 1px 4px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.4); }
    .token-card-flag { position: absolute; top: -6px; left: -6px; font-size: 0.72rem; }
    .token-label { margin-top: 3px; background: rgba(6,16,30,0.92); color: #fff; font-size: 0.68rem; font-weight: 800; padding: 1.5px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.22); max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; pointer-events: none; }
    .token-label .lbl-mins { color: #fef08a; font-weight: 900; margin-left: 2px; }
    .token-label .lbl-mins.over { color: #fca5a5; }

    /* CLEANUP 3: 1-ROW 3-PILL TOUCHLINE ACTION STRIP */
    .touchline-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .btn-touch { min-height: 44px; border: 2px solid var(--text-main); border-radius: 10px; font-size: 0.84rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 6px 8px; box-shadow: 0 2px 0 rgba(15,23,42,0.12); }
    .btn-touch.goal-us { background: #dcfce7; color: #14532d; border-color: #15803d; }
    .btn-touch.goal-them { background: #fee2e2; color: #7f1d1d; border-color: #b91c1c; }
    .btn-touch.sub-btn { background: var(--sky-token); color: var(--navy-950); }
    .btn-touch.card-btn { background: #fef3c7; color: #78350f; border-color: #d97706; }

    /* CLEANUP 4: COMPACT 3-COLUMN BENCH GRID */
    .bench-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .bench-card { background: #f8fafc; border: 2px solid var(--text-main); border-radius: 9px; padding: 6px 7px 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
    .bench-card.selected { background: #fef9c3; border-color: #ca8a04; outline: 3px solid #facc15; }
    .bench-top-row { display: flex; align-items: center; gap: 5px; overflow: hidden; }
    .num-circle { width: 24px; height: 24px; border-radius: 50%; background: var(--sky-token); border: 1.5px solid var(--navy-950); color: var(--navy-950); font-weight: 900; font-size: 0.74rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .bench-name { font-weight: 800; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bench-meta-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.66rem; font-weight: 800; color: var(--text-muted); }
    .need-pill { color: #15803d; font-weight: 900; }
    .prog-track { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: #cbd5e1; }
    .prog-fill { height: 100%; background: var(--green-bright); }

    .info-banner { background: #e0f2fe; border: 2px solid #0284c7; color: #0369a1; font-size: 0.76rem; font-weight: 800; padding: 8px 10px; border-radius: 10px; margin-bottom: 8px; text-align: center; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .field-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
    .field-label { font-size: 0.68rem; font-weight: 900; text-transform: uppercase; color: var(--text-muted); }
    .day-input, .day-select { min-height: 42px; background: #fff; border: 2px solid var(--text-main); border-radius: 9px; padding: 0 10px; font-size: 0.88rem; font-weight: 800; color: var(--text-main); width: 100%; }
    .segmented-toggle { display: grid; grid-template-columns: 1fr 1fr; background: #e2e8f0; border: 2px solid var(--text-main); border-radius: 9px; padding: 2px; min-height: 42px; }
    .seg-btn { border: none; background: transparent; font-weight: 900; font-size: 0.8rem; color: var(--text-muted); border-radius: 6px; cursor: pointer; }
    .seg-btn.active { background: var(--navy-900); color: #fff; }
    .lineup-btn-row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; margin-top: 4px; }
    .btn-sky { min-height: 42px; background: var(--sky-token); border: 2px solid var(--text-main); border-radius: 9px; font-weight: 900; font-size: 0.84rem; color: var(--navy-950); cursor: pointer; padding: 0 10px; }
    .btn-outline { min-height: 42px; background: #f1f5f9; border: 2px solid var(--text-main); border-radius: 9px; font-weight: 800; font-size: 0.78rem; color: var(--text-main); cursor: pointer; padding: 0 9px; }
    .subtab-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .subtab-btn { min-height: 42px; border: 2px solid var(--text-main); border-radius: 9px; background: #e2e8f0; color: var(--text-main); font-weight: 900; font-size: 0.85rem; cursor: pointer; }
    .subtab-btn.active { background: var(--navy-900); color: #fff; }
    .roster-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border: 2px solid #cbd5e1; border-radius: 9px; margin-bottom: 6px; background: #fff; }
    .roster-row.unavailable { opacity: 0.55; background: #f1f5f9; }
    .roster-actions { display: flex; gap: 5px; align-items: center; }
    .btn-avail { min-height: 36px; padding: 0 9px; border-radius: 7px; font-weight: 800; font-size: 0.74rem; border: 2px solid var(--text-main); cursor: pointer; }
    .btn-avail.yes { background: #dcfce7; color: #14532d; }
    .btn-avail.no { background: #fee2e2; color: #7f1d1d; }
    .btn-icon-sq { width: 36px; height: 36px; border-radius: 7px; border: 2px solid var(--text-main); background: #f8fafc; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .stats-table th { background: var(--navy-900); color: #fff; padding: 8px 5px; text-align: left; font-weight: 900; }
    .stats-table td { padding: 8px 5px; border-bottom: 1.5px solid #cbd5e1; font-weight: 700; }
    .stats-table tr:nth-child(even) { background: #f8fafc; }
    .timeline-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 9px; background: #f8fafc; border-left: 3.5px solid var(--navy-900); border-radius: 5px; margin-bottom: 5px; font-size: 0.8rem; font-weight: 700; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: var(--navy-900); border-top: 2px solid var(--navy-700); display: grid; grid-template-columns: repeat(4, 1fr); z-index: 9999; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .nav-tab { background: transparent; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 0.7rem; font-weight: 800; cursor: pointer; position: relative; }
    .nav-tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; pointer-events: none; }
    .nav-tab span { pointer-events: none; }
    .nav-tab.active { color: var(--sky-token); background: rgba(114,194,235,0.12); }
    .nav-tab.active::before { content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 3px; background: var(--sky-token); border-radius: 0 0 4px 4px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(6,16,30,0.82); z-index: 10000; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal-sheet { background: #fff; color: var(--text-main); width: 100%; max-width: 600px; border-radius: 18px 18px 0 0; border-top: 4px solid var(--navy-900); padding: 14px; max-height: 90vh; overflow-y: auto; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 2px solid #e2e8f0; }
    .sheet-title { font-size: 1rem; font-weight: 900; }
    .btn-close { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--text-main); background: #f1f5f9; font-weight: 900; font-size: 0.95rem; cursor: pointer; }
    .report-pre { background: #0f172a; color: #f8fafc; padding: 10px; border-radius: 9px; font-family: monospace; font-size: 0.78rem; white-space: pre-wrap; margin-bottom: 10px; max-height: 220px; overflow-y: auto; }
    .past-player-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 6px 8px; border: 1.5px solid #cbd5e1; border-radius: 7px; margin-bottom: 5px; background: #f8fafc; }
    .mini-num-input { width: 44px; height: 34px; border: 2px solid var(--text-main); border-radius: 6px; text-align: center; font-weight: 800; font-size: 0.82rem; }
  </style>
</head>
<body>

  <!-- CLEANUP 1: BROADCAST SCOREBUG HEADER -->
  <header class="top-cockpit">
    <div class="app-bar">
      <div class="brand-logo" onclick="handleSecretAdminTap()"><span class="brand-dot"></span><span>MATCHDAY <small style="font-size:0.62rem;color:#72c2eb;">v7.3</small></span></div>
      <div class="header-pills">
        <button class="icon-pill" onclick="forceCloudPull()" title="Cloud Sync"><span class="dot-indicator active" id="cloud-dot"></span></button>
        <button class="icon-pill" onclick="toggleWakeLock()" title="Screen Wake Lock"><span class="dot-indicator active" id="wake-dot"></span>🔒</button>
        <button class="icon-pill" onclick="undoLastAction()" title="Undo Last Event">↩️ Undo</button>
        <button class="icon-pill settings-btn" onclick="openSettingsModal()">⚙️ <span id="header-team-code">Setup</span></button>
      </div>
    </div>

    <div class="scoreboard-row">
      <div class="score-team-col home"><span class="us-tag" id="badge-left">HOME</span><div class="score-team-name" id="team-left">Opposition</div></div>
      <div class="score-center-box" id="score-display">0 - 0</div>
      <div class="score-team-col away"><div class="score-team-name" id="team-right">My Team</div><span class="us-tag" id="badge-right">US</span></div>
    </div>

    <div class="control-strip">
      <di
